[package]
name = "praevis-thetadata-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Independent, unofficial ThetaData authentication CLI: in-memory login, with opt-in (auth --save) Windows/Linux native session storage"
readme = "README.md"
repository.workspace = true
documentation = "https://github.com/Praevis-Quant/praevis-thetadata/tree/main/apps/praevis-thetadata-cli"
keywords = ["thetadata", "authentication", "cli"]
categories = ["command-line-utilities", "authentication"]

[[bin]]
name = "praevis-thetadata"
path = "src/main.rs"

[dependencies]
# The CLI is the explicit opt-in for native session persistence (ADR-0020).
praevis-thetadata-auth = { workspace = true, features = ["native-store"] }
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
