[package]
name = "praevis-thetadata-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Experimental independent Rust gRPC client for ThetaData market data: raw RPC bindings and a typed stock EOD stream with limits on its accounted decode allocations"
readme = "README.md"
documentation = "https://docs.rs/praevis-thetadata-client"
keywords = ["thetadata", "grpc", "market-data", "finance", "eod"]
categories = ["api-bindings", "finance", "network-programming"]
# Checkout-only targets: the EOD benchmark and the manual live runner include sibling
# sources, the workspace lockfile and live-capture paths, so they are not self-contained.
exclude = ["examples/"]

[features]
# Manual verification only. Ordinary workspace/CI commands omit this target.
live-tests = []

[[example]]
name = "live_eod"
required-features = ["live-tests"]

# Phase P0 live measurements (performance plan C.2): manual only, never CI runs.
[[example]]
name = "live_p0"
required-features = ["live-tests"]

# Runnable consumer pattern (EOD-L3-025). `test = true` runs its tests in
# `cargo test --workspace`; it is checkout-only like the other examples.
[[example]]
name = "eod_partial"
test = true

[dependencies]
chrono.workspace = true
http-body = "1"
praevis-thetadata-auth.workspace = true
praevis-thetadata-arrow.workspace = true
praevis-thetadata-core.workspace = true
praevis-thetadata-proto.workspace = true
prost.workspace = true
thiserror.workspace = true
tokio.workspace = true
tonic.workspace = true
zstd.workspace = true

[build-dependencies]
# The descriptor comes from the proto package itself, so the archive builds standalone.
praevis-thetadata-proto.workspace = true
prost.workspace = true
prost-types.workspace = true
heck = "0.5"

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# Dependency-log capture test (EOD-L3-017, decision D-D a): both are already in the
# graph through tonic/hyper/reqwest; used only to install test collectors.
tracing = "0.1"
log = { version = "0.4", features = ["std"] }
# Paused-clock lifecycle tests (EOD-L3-019, deferred item 4). A feature of the
# existing tokio dependency, enabled for tests only; it adds no packages.
tokio = { workspace = true, features = ["test-util"] }
# Trusted-TLS success fixture (EOD-L3-005, decision D-F b): each test generates
# its own CA, server certificate and key, so no key material is committed.
# Uses the ring backend already in the graph through rustls; never aws-lc.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
