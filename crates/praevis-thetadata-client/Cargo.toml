[package]
name = "praevis-thetadata-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Experimental independent Rust gRPC client for ThetaData market data: raw RPC bindings and a typed, bounded stock EOD stream"
readme = "README.md"
documentation = "https://docs.rs/praevis-thetadata-client"
keywords = ["thetadata", "grpc", "market-data", "finance", "eod"]
categories = ["api-bindings", "finance", "network-programming"]

[features]
# Manual verification only. Ordinary workspace/CI commands omit this target.
live-tests = []

[[example]]
name = "live_eod"
required-features = ["live-tests"]

[dependencies]
chrono.workspace = true
http-body = "1"
praevis-thetadata-auth.workspace = true
praevis-thetadata-core.workspace = true
praevis-thetadata-proto.workspace = true
prost.workspace = true
thiserror.workspace = true
tokio.workspace = true
tonic.workspace = true
zstd.workspace = true

[build-dependencies]
prost.workspace = true
prost-types.workspace = true
heck = "0.5"

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
