[package]
name = "praevis-thetadata-stream"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# Published from alpha.3 (user decision 2026-11-07), experimental.
publish.workspace = true
description = "Experimental: real-time option events from an operator-run Theta Terminal's local WebSocket, parsed without allocation (independent, unofficial)"
readme = "README.md"
documentation = "https://docs.rs/praevis-thetadata-stream"
keywords = ["thetadata", "websocket", "market-data", "options", "real-time"]
categories = ["finance", "network-programming"]
# The examples are manual live tools that need the client and a Terminal.
exclude = ["examples/", "tests/"]

[dependencies]
# Approved by the user on 2026-11-05 (the WebSocket client, real-time path
# only). The synchronous core of tokio-tungstenite; no TLS: the Terminal is
# local.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
thiserror.workspace = true

[features]
# Manual live examples only (never CI): the login-conflict probe.
live-tests = []

[[example]]
name = "login_conflict_probe"
required-features = ["live-tests"]

[[example]]
name = "latency"
required-features = ["live-tests"]

[[example]]
name = "discover_contracts"
required-features = ["live-tests"]

[dev-dependencies]
# The tests' Terminal servers (ADR-0022). Path only: never in the published
# manifest, so the tests are checkout-only (excluded above).
praevis-thetadata-emulator.workspace = true
# The probe logs in the historical (gRPC) client while the stream is open.
praevis-thetadata-client.workspace = true
tokio.workspace = true
clap.workspace = true
serde_json.workspace = true
