[package]
name = "praevis-thetadata-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Independent Rust client for ThetaData HTTPS authentication: in-memory sessions, with optional (native-store feature) Windows/Linux session persistence. Not affiliated with Theta Data Inc."
readme = "README.md"
documentation = "https://docs.rs/praevis-thetadata-auth"
keywords = ["thetadata", "authentication", "market-data", "keyring"]
categories = ["authentication", "api-bindings"]

[features]
# Optional native session persistence (ADR-0020). Off by default: the default build
# authenticates into an in-memory Session, like the vendor Python package, and pulls in
# no keyring, D-Bus or Windows credential dependencies. The CLI enables it explicitly.
native-store = ["dep:keyring", "dep:dbus-secret-service"]

[package.metadata.docs.rs]
features = ["native-store"]

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"], optional = true }

# The macOS Keychain (user approval 2026-11-15). It adds security-framework
# 2.11 and core-foundation 0.9, older majors than the copies already in the
# build through the native TLS roots.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"], optional = true }

# Linux: the Secret Service over D-Bus through dbus-secret-service, with a
# vendored libdbus. Its crypto-rust feature (the secret encrypted on the
# session bus) is enabled on dbus-secret-service itself, not through
# keyring's crypto-rust: that one also names "secret-service?/crypto-rust", and
# Cargo writes a weak dependency feature's target into Cargo.lock even when
# it is never built (rust-lang/cargo#10801). That put secret-service and the
# unmaintained zbus, zvariant, zvariant_derive and zbus_names
# (RUSTSEC-2026-0370 to -0372) in the lockfile. dbus-secret-service is the
# same crate and version keyring already used; no crate is added.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "vendored"], optional = true }
dbus-secret-service = { version = "4.1.0", features = ["crypto-rust"], optional = true }

[dev-dependencies]
tokio.workspace = true
