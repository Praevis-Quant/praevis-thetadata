[package]
name = "praevis-thetadata-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Independent Rust client for ThetaData HTTPS authentication: in-memory sessions, with optional (native-store feature) Windows/Linux session persistence. Not affiliated with Theta Data Inc."
readme = "README.md"
documentation = "https://docs.rs/praevis-thetadata-auth"
keywords = ["thetadata", "authentication", "market-data", "keyring"]
categories = ["authentication", "api-bindings"]

[features]
# Optional native session persistence (ADR-0020). Off by default: the default build
# authenticates into an in-memory Session, like the vendor Python package, and pulls in
# no keyring, D-Bus or Windows credential dependencies. The CLI enables it explicitly.
native-store = ["dep:keyring"]

[package.metadata.docs.rs]
features = ["native-store"]

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"], optional = true }

[dev-dependencies]
tokio.workspace = true
