[package]
name = "praevis-thetadata-emulator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Dev-only emulator of ThetaData's documented interfaces for tests (ADR-0022); never published"
# Test infrastructure only (ADR-0022): never published, never a dependency of a
# published crate's normal build.
publish = false

[dependencies]
praevis-thetadata-proto.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic.workspace = true
zstd.workspace = true

[build-dependencies]
# The descriptor comes from the proto package, as in the client's build script.
praevis-thetadata-proto.workspace = true
prost.workspace = true
prost-types.workspace = true
heck = "0.5"

[dev-dependencies]
praevis-thetadata-client.workspace = true
