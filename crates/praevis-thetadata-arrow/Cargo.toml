[package]
name = "praevis-thetadata-arrow"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
# Not published yet: publication is a release decision (P1 design §9; the
# alpha.3 release is on hold).
publish = false
description = "Exact Arrow columns from ThetaData gRPC responses for the independent praevis-thetadata clients"
readme = "README.md"
keywords = ["thetadata", "arrow", "market-data", "finance"]
categories = ["finance", "encoding"]

[dependencies]
# arrow-rs (approved as a set with parquet and pyo3, plan decision 3). Only the
# array and schema crates: the decoder needs builders and types, not compute.
arrow-array = { version = "60.1", default-features = false }
arrow-schema = { version = "60.1", default-features = false }
praevis-thetadata-core.workspace = true
praevis-thetadata-proto.workspace = true
prost.workspace = true
thiserror.workspace = true
zstd.workspace = true
