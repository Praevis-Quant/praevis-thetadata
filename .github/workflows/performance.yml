name: Auth performance

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Optional baseline Git ref for a same-runner before/after comparison'
        required: false
        type: string

permissions:
  contents: read

jobs:
  baseline:
    if: github.event_name != 'workflow_dispatch' || inputs.baseline_ref == ''
    name: Baseline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: Build release CLI
        run: cargo build --locked --release -p praevis-thetadata-cli
      - name: Install Linux keyring fixture
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends dbus gnome-keyring
      - name: Linux baseline
        if: runner.os == 'Linux'
        run: bash tools/with-test-keyring.sh python3 tools/benchmark_auth.py --binary target/release/praevis-thetadata --samples 30 --output artifacts/auth-linux.json
      - name: Windows baseline
        if: runner.os == 'Windows'
        run: python tools/benchmark_auth.py --binary target/release/praevis-thetadata.exe --samples 30 --output artifacts/auth-windows.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auth-performance-${{ runner.os }}-${{ github.sha }}
          path: artifacts/auth-*.json
          if-no-files-found: error
          retention-days: 30

  compare:
    if: github.event_name == 'workflow_dispatch' && inputs.baseline_ref != ''
    name: Compare startup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Full history of this repository only: its branches and tags, never a
      # fork's. The baseline must resolve inside it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      # Accept only a 40-hex commit SHA present in this repository, or an
      # existing branch or tag of it; anything else fails before any
      # checkout or build. The baseline is checked out by the resolved SHA,
      # never by the raw input. Read-only token, no credentials kept, and no
      # cache anywhere in this workflow.
      - name: Validate the baseline ref
        id: baseline
        shell: bash
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          cd candidate
          ref="$BASELINE_REF"
          if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            git cat-file -e "$ref^{commit}" 2>/dev/null || { echo "::error::$ref is not a commit in this repository"; exit 1; }
            sha="$ref"
          elif git check-ref-format "refs/heads/$ref" && [[ "$ref" != -* ]]; then
            if sha=$(git rev-parse --verify --quiet "refs/remotes/origin/$ref^{commit}"); then :
            elif sha=$(git rev-parse --verify --quiet "refs/tags/$ref^{commit}"); then :
            else echo "::error::no branch or tag named $ref in this repository"; exit 1
            fi
          else
            echo "::error::baseline_ref must be a 40-hex commit SHA or a branch or tag name"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "baseline: $ref = $sha"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.baseline.outputs.sha }}
          path: baseline
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: Build before and after with provenance
        shell: bash
        env:
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          python candidate/tools/build_cli_benchmark.py --source baseline --output "artifacts/before$EXE"
          python candidate/tools/build_cli_benchmark.py --source candidate --output "artifacts/after$EXE"
      - name: Install Linux keyring fixture
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends dbus gnome-keyring
      - name: Compare release binaries twice
        shell: bash
        run: |
          for repetition in 1 2; do
            if [ "$RUNNER_OS" = Linux ]; then
              bash candidate/tools/with-test-keyring.sh python3 candidate/tools/compare_cli_startup.py --before artifacts/before --after artifacts/after --before-provenance artifacts/before.json --after-provenance artifacts/after.json --output "artifacts/comparison-$repetition.json"
            else
              python candidate/tools/compare_cli_startup.py --before artifacts/before.exe --after artifacts/after.exe --before-provenance artifacts/before.json --after-provenance artifacts/after.json --output "artifacts/comparison-$repetition.json"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: startup-comparison-${{ runner.os }}-${{ github.sha }}
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 30
