name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Repository and documentation checks
        run: |
          python tools/check_repository.py
          python tools/research_python.py --check
          python tools/generate_endpoints.py --check
      - name: Install Python check dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Test Python tooling without network
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Compile-check the manual live runner (never executed in CI)
        run: cargo clippy --locked -p praevis-thetadata-client --features live-tests --example live_eod --example live_p0 --example live_job_memory -- -D warnings
      - name: Clippy (real-time live probe)
        run: cargo clippy --locked -p praevis-thetadata-stream --features live-tests --examples -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Live runner offline tests (loopback fixture only; never contacts the service)
        run: cargo test --locked -p praevis-thetadata-client --features live-tests --example live_p0
      - name: Real-time harness offline tests (unit tests only; never connects)
        run: cargo test --locked -p praevis-thetadata-stream --features live-tests --examples
      - name: Auth feature boundary (default in-memory, optional native store)
        shell: bash
        run: |
          # Selecting only the auth package builds it without the CLI's native-store feature.
          cargo clippy --locked -p praevis-thetadata-auth --all-targets -- -D warnings
          cargo test --locked -p praevis-thetadata-auth
          cargo test --locked -p praevis-thetadata-auth --features native-store
          for package in praevis-thetadata-auth praevis-thetadata-client; do
            if cargo tree --locked -p "$package" -e normal --target all | grep -iE 'keyring|dbus'; then
              echo "$package default build must not depend on native credential stores"; exit 1
            fi
          done
          cargo tree --locked -p praevis-thetadata-auth -e normal --target all --features native-store | grep -q keyring
      - name: Native EOD benchmark checks
        run: cargo test --locked -p praevis-thetadata-client --example eod_benchmark
      - name: Columnar decoder CPU benchmark (checks and a small smoke run)
        run: |
          cargo test --locked -p praevis-thetadata-client --example columnar_benchmark
          cargo run --release --locked -p praevis-thetadata-client --example columnar_benchmark -- --rows 2000 --samples 3 --output artifacts/columnar-smoke.json
      - name: Credential-free EOD benchmark smoke test
        run: |
          cargo run --release --locked -p praevis-thetadata-client --example eod_benchmark -- run --engine legacy --rows 64 --samples 2 --warmups 1 --streams 2 --output artifacts/eod-smoke-legacy.json
          cargo run --release --locked -p praevis-thetadata-client --example eod_benchmark -- run --engine table --rows 64 --samples 2 --warmups 1 --streams 2 --output artifacts/eod-smoke-table.json
          cargo run --release --locked -p praevis-thetadata-client --example eod_benchmark -- run --engine numeric --rows 64 --samples 2 --warmups 1 --streams 2 --output artifacts/eod-smoke-numeric.json
          cargo run --release --locked -p praevis-thetadata-client --example eod_benchmark -- run --engine numeric-offload --rows 64 --samples 2 --warmups 1 --streams 2 --consumer-delay-ms 1 --output artifacts/eod-smoke-offload.json
      - name: Install Linux keyring fixture
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends dbus gnome-keyring
      - name: Linux native persistence
        if: runner.os == 'Linux'
        run: bash tools/test-linux-persistence.sh
      - name: Windows native persistence
        if: runner.os == 'Windows'
        run: cargo test --locked -p praevis-thetadata-cli --test persistence -- --ignored

  python-package:
    # P1 PR 6a: build the abi3 wheel and run its offline tests, including the
    # plan D.2 gates. Nothing is uploaded or published; the vendor package is
    # never installed.
    name: Python package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install hash-pinned build and test dependencies
        run: python -m pip install --require-hashes -r crates/praevis-thetadata-py/requirements-test.txt
      - name: Build the wheel (Windows)
        if: runner.os == 'Windows'
        run: maturin build --release --locked -m crates/praevis-thetadata-py/Cargo.toml -o dist
      # Linux: build inside PyPA's manylinux_2_28 image (pinned by digest), so the wheel
      # installs on glibc 2.28+ (RHEL 8, Debian 11, Ubuntu 20.04-era) rather than the
      # runner's newer glibc. maturin is the same hash-pinned version as above.
      - name: Build the wheel (Linux, manylinux_2_28)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          awk '/^maturin==/{p=1;print;next} p&&/^ /{print;next} p{exit}' \
            crates/praevis-thetadata-py/requirements-test.txt > "$RUNNER_TEMP/maturin.txt"
          cp "$RUNNER_TEMP/maturin.txt" .maturin-requirements.txt
          docker run --rm -v "$PWD:/io" -w /io -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            quay.io/pypa/manylinux_2_28_x86_64:2026.11.07-1@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36 \
            bash -euo pipefail -c '
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              . "$HOME/.cargo/env"
              /opt/python/cp312-cp312/bin/python -m pip install --quiet --require-hashes -r .maturin-requirements.txt
              /opt/python/cp312-cp312/bin/maturin build --release --locked --compatibility manylinux_2_28 \
                -m crates/praevis-thetadata-py/Cargo.toml -o dist
              chown -R "$HOST_UID:$HOST_GID" dist target'
          rm .maturin-requirements.txt
          ls dist/*-cp310-abi3-manylinux_2_28_x86_64.whl
      - name: Install the wheel
        run: python -m pip install --no-index --find-links dist praevis-thetadata
      - name: Wheel smoke import (a clean environment with no other packages)
        run: |
          set -euo pipefail
          ls dist/*-abi3-*.whl
          # Linux: the smoke test installs the manylinux_2_28 wheel, the one that ships.
          if [ "$RUNNER_OS" = Linux ]; then ls dist/*-manylinux_2_28_x86_64.whl; fi
          python -m venv "$RUNNER_TEMP/smoke"
          py="$RUNNER_TEMP/smoke/bin/python"; [ -x "$py" ] || py="$RUNNER_TEMP/smoke/Scripts/python.exe"
          "$py" -m pip install --quiet --no-index --find-links dist praevis-thetadata
          version=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          "$py" -c "import sys, praevis_thetadata as pt; v = pt.__version__; print('praevis_thetadata', v); assert v == sys.argv[1], (v, sys.argv[1]); assert len(pt.endpoints()) == 100" "$version"
      - name: Keep the abi3 wheel (for the GitHub release; never uploaded to PyPI)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
      - name: Offline tests and D.2 gates
        run: python -m unittest discover -s crates/praevis-thetadata-py/tests -v
      - name: P1 exit runners, offline
        run: python -m unittest discover -s bench/p1 -p 'test_*.py' -v

  packaging-rehearsal:
    # Builds the seven published archives at the workspace version, stages them in a local file://
    # registry in publication order (auth/core/proto, arrow, client/cli, stream), inspects every
    # archive for license files and forbidden inputs (artifacts, keys, credentials), and builds
    # external consumers and `cargo install` of the CLI outside the workspace. Never publishes;
    # reads no token.
    name: Packaging rehearsal (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - name: Stage archives and build consumers
        run: python tools/staging_registry.py --work target/staging
      - name: Keep rehearsal report and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaging-rehearsal-${{ matrix.os }}
          path: |
            target/staging/report.json
            target/staging/logs/
          if-no-files-found: warn
