name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Repository and documentation checks
        run: |
          python tools/check_repository.py
          python tools/research_python.py --check
      - name: Install Python check dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Test Python tooling without network
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Native EOD benchmark checks
        run: cargo test --locked -p thetadata-client --example eod_benchmark
      - name: Credential-free EOD benchmark smoke test
        run: cargo run --release --locked -p thetadata-client --example eod_benchmark -- run --rows 64 --samples 2 --warmups 1 --streams 2 --output artifacts/eod-smoke.json
      - name: Install Linux keyring fixture
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends dbus gnome-keyring
      - name: Linux native persistence
        if: runner.os == 'Linux'
        run: bash tools/test-linux-persistence.sh
      - name: Windows native persistence
        if: runner.os == 'Windows'
        run: cargo test --locked -p thetadata-cli --test persistence -- --ignored
