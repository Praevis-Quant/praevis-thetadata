name: Upstream Python compatibility

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Compare tracked Python version with PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install version comparison tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Test comparison policy without network
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Check latest stable release on PyPI
        run: python tools/check_upstream.py
