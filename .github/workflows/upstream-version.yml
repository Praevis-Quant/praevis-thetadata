name: Upstream Python compatibility

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Compare tracked Python version with PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install version comparison tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Test comparison policy without network
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Check latest stable release on PyPI
        run: python tools/check_upstream.py
