name: Workflow security

# zizmor audits every workflow and the Dependabot configuration for known
# GitHub Actions weaknesses (template injection, credential persistence,
# excessive permissions, unpinned or impostor actions, ...). Findings fail
# the check.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.32.0"
          collect: all
          # Fail on findings here, rather than only reporting to code scanning.
          advanced-security: false
          annotations: true
