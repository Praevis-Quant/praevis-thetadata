name: Supply chain

# cargo-deny over the locked dependency graph (deny.toml): RustSec advisories,
# licences and sources fail; duplicate versions warn. Also weekly, because a
# new advisory can land against an unchanged lockfile.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The workspace (advisories, licences, sources, duplicates)
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check
          arguments: --all-features
      # The test crate's own lockfile (never published): advisories only.
      - name: The TLS-provider test crate (advisories)
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          manifest-path: tools/tls-providers/Cargo.toml
          command: check
          # deny.toml is read from the working directory, the repository root.
          command-arguments: advisories
