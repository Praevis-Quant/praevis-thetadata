# Weekly dependency updates, one grouped pull request per ecosystem and
# directory. Security updates (Dependabot alerts) are separate and immediate.
# Every update goes through CI like any other change; nothing is merged
# automatically. A version must be a week old before it is proposed (the
# cooldown), so a malicious release that is caught and yanked quickly never
# reaches a pull request; security updates are not delayed by it.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
    open-pull-requests-limit: 5

  # The TLS-provider test crate has its own workspace and lockfile.
  - package-ecosystem: cargo
    directory: /tools/tls-providers
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      tls-providers:
        patterns: ["*"]
    # Our own crates are path dependencies here; the main workspace moves them.
    ignore:
      - dependency-name: "praevis-thetadata-*"

  # The Python package's hash-pinned build requirements (requirements-test.txt,
  # pip-compile on Python 3.12). Dependabot recompiles every lock in a
  # directory with one Python, the one the first pip-compile header there
  # names, so each Python's test lock has its own directory below.
  - package-ecosystem: pip
    directory: /crates/praevis-thetadata-py
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python-package:
        patterns: ["*"]

  # The version matrix's test locks, one directory per Python version, each
  # recompiled with that version.
  - package-ecosystem: pip
    directories:
      - /crates/praevis-thetadata-py/requirements-matrix/3.10
      - /crates/praevis-thetadata-py/requirements-matrix/3.11
      - /crates/praevis-thetadata-py/requirements-matrix/3.12
      - /crates/praevis-thetadata-py/requirements-matrix/3.13
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python-matrix:
        patterns: ["*"]

  # CI tooling: requirements.in compiled by pip-compile into the hash-pinned
  # requirements.txt; Dependabot recompiles it, hashes included.
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      tools:
        patterns: ["*"]

  # Actions stay pinned by full commit SHA; Dependabot updates the SHA and
  # the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

# Not updated: bench/python-baseline/requirements.txt pins the environment of
# the recorded vendor-package benchmarks; changing it would change what the
# retained measurements compare against. Update it by hand with a new run.
