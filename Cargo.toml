[workspace]
members = ["crates/praevis-thetadata-auth", "crates/praevis-thetadata-proto", "crates/praevis-thetadata-core", "crates/praevis-thetadata-client", "apps/praevis-thetadata-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/Praevis-Quant/praevis-thetadata"

[workspace.dependencies]
praevis-thetadata-auth = { path = "crates/praevis-thetadata-auth" }
praevis-thetadata-proto = { path = "crates/praevis-thetadata-proto" }
praevis-thetadata-core = { path = "crates/praevis-thetadata-core" }
praevis-thetadata-client = { path = "crates/praevis-thetadata-client" }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.6", features = ["derive", "env"] }
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tonic = { version = "0.14", features = ["tls-native-roots"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
zstd = "0.13"
