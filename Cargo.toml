[workspace]
members = ["crates/praevis-thetadata-auth", "crates/praevis-thetadata-proto", "crates/praevis-thetadata-core", "crates/praevis-thetadata-arrow", "crates/praevis-thetadata-client", "crates/praevis-thetadata-py", "crates/praevis-thetadata-stream", "crates/praevis-thetadata-emulator", "crates/praevis-thetadata-scenarios", "apps/praevis-thetadata-cli"]
resolver = "3"

[workspace.package]
version = "0.1.6"
edition = "2024"
# Verified with `cargo +1.88 check --all-targets` and `cargo +1.88 test` on the locked graph;
# tonic 0.14 and ICU 2.x dependencies require 1.88.
rust-version = "1.88"
license = "Apache-2.0"
# crates.io only, published only by .github/workflows/trusted-publishing.yml on a v* tag,
# after the user approves its `crates-io` environment (trusted publishing, no
# tokens; docs/releasing.md). Nothing else publishes.
publish = ["crates-io"]
repository = "https://github.com/Praevis-Quant/praevis-thetadata"

[workspace.dependencies]
praevis-thetadata-auth = { path = "crates/praevis-thetadata-auth", version = "=0.1.6" }
praevis-thetadata-proto = { path = "crates/praevis-thetadata-proto", version = "=0.1.6" }
praevis-thetadata-core = { path = "crates/praevis-thetadata-core", version = "=0.1.6" }
praevis-thetadata-arrow = { path = "crates/praevis-thetadata-arrow", version = "=0.1.6" }
praevis-thetadata-client = { path = "crates/praevis-thetadata-client", version = "=0.1.6" }
# Dev-only (ADR-0022): no version, so cargo strips it from published manifests.
praevis-thetadata-emulator = { path = "crates/praevis-thetadata-emulator" }
chrono = { version = "0.4", features = ["serde"] }
# Time zones (America/New_York) from jiff's bundled tz database only: never
# the host's zoneinfo, so output is platform-independent (user approval
# 2026-11-18; replaces the unmaintained chrono-tz).
jiff = { version = "1.0.1", default-features = false, features = ["std", "tzdb-bundle-always"] }
clap = { version = "4.6", features = ["derive", "env"] }
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
# tls-ring: when the application installed no process-default rustls
# provider, tonic builds its TLS configuration with ring explicitly, as
# reqwest does. Without it tonic asks rustls for the process default, which
# panics when a consumer's other dependencies also enable aws-lc-rs.
tonic = { version = "0.14", features = ["tls-native-roots", "tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
zstd = "0.14"
